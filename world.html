<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界观 · OC ARCHIVE</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topnav">
  <a class="brand" href="index.html" style="display:flex;align-items:center;">
    <span class="brand-mark"></span>
    <span class="brand-name" data-site-name style="margin-left:8px;">OC ARCHIVE</span>
  </a>
  <nav>
    <a href="index.html">世界观总览</a>
    <a href="drabbles.html">短打</a>
  </nav>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="breadcrumb" id="breadcrumb"></div>
    <div id="world-root"></div>
  </main>
</div>

<footer class="site-footer">OC ARCHIVE — 由你自己定义风格</footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
  // 侧栏：所有世界观列表
  (function renderSidebar() {
    const sidebar = document.getElementById("sidebar");
    const currentId = qsParam("id");
    const title = el("h3", { text: "世界观" });
    sidebar.appendChild(title);
    const ul = el("ul");
    WORLDS.forEach((w) => {
      ul.appendChild(
        el("li", {}, [
          el("a", {
            href: `world.html?id=${w.id}`,
            class: w.id === currentId ? "active" : "",
            text: w.title,
          }),
        ])
      );
    });
    sidebar.appendChild(ul);
  })();

  renderWorldDetail();
</script>
</body>
</html>
